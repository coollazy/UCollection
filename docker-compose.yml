services:
  app:
    build: .
    ports:
      - "${LISTEN_PORT:-8080}:8080"
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-ucollection}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ucollection}?sslmode=disable
      ENVIRONMENT: ${ENVIRONMENT:-production}
      USDT_CONTRACT_ADDRESS: ${USDT_CONTRACT_ADDRESS:?Set USDT_CONTRACT_ADDRESS in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      TRONGRID_BASE_URL: ${TRONGRID_BASE_URL:-https://api.trongrid.io}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ucollection}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ucollection}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ucollection}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
