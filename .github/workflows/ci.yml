name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'README.md'

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ucollection
          POSTGRES_PASSWORD: ucollection
          POSTGRES_DB: ucollection
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ucollection"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ucollection:ucollection@localhost:5432/ucollection?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: go build
        run: go build ./...

      - name: go test
        # -p 1: packages with real-PostgreSQL integration tests share one DB
        # instance/table set (the postgres service above), so package test
        # binaries must not run concurrently.
        run: go test ./... -race -p 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: consolidation sign page JS tests
        run: npm test

      - name: consolidation sign page bundle drift check
        # Fails if web/static/js/{polyfill.bundle,bundle}.js don't match a
        # fresh build from web/js-src/ — catches a source change committed
        # without re-running `npm run build` (see
        # scripts/build-consolidation-sign.mjs).
        run: npm run build:check

      - name: docker build
        run: docker build -t ucollection:ci .
