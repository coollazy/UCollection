<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>API Key 管理 - UCollection 後台</title><link rel="stylesheet" href="/static/css/admin.css"></head>
<body>
<div class="layout">
{{template "nav" .}}
<main class="main">
<div class="main-head"><div><h1>API Key 管理</h1></div></div>
{{if .FlashError}}<div class="alert alert--error">{{.FlashError}}</div>{{end}}
{{if .Notice}}<div class="alert alert--info">{{.Notice}}</div>{{end}}

<div class="card" style="margin-bottom:var(--sp5)">
<form method="post" action="/admin/api-keys/regenerate" onsubmit="return confirm('重新產生會讓既有API串接立即失效，確定要繼續嗎？');">
  <div class="field" style="margin-bottom:var(--sp3)"><span class="lbl">TOTP驗證碼</span><input type="text" name="totp_code" class="input--code" inputmode="numeric" autocomplete="off" required></div>
  <button type="submit" class="btn btn--primary">重新產生 API Key</button>
</form>
</div>

<div class="table-wrap">
<table class="table">
  <tr><th>ID</th><th>建立時間</th><th>狀態</th></tr>
  {{range .Keys}}
  <tr>
    <td>{{.ID}}</td>
    <td>{{ts .CreatedAt}}</td>
    <td><span class="pill {{if .Revoked}}pill--not-consolidated{{else}}pill--completed{{end}}">{{if .Revoked}}已作廢{{else}}使用中{{end}}</span></td>
  </tr>
  {{end}}
</table>
</div>
<script src="/static/js/localtime.js"></script>
</main>
</div>
</body>
</html>
