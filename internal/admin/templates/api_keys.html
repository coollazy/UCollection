<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>API Key 管理 - UCollection 後台</title><link rel="stylesheet" href="/static/css/admin.css"></head>
<body>
<h1>API Key 管理</h1>
{{template "nav" .}}
{{if .FlashError}}<p style="color:red">{{.FlashError}}</p>{{end}}
{{if .Notice}}<p style="color:blue">{{.Notice}}</p>{{end}}

<form method="post" action="/admin/api-keys/regenerate" onsubmit="return confirm('重新產生會讓既有API串接立即失效，確定要繼續嗎？');">
  <label>TOTP驗證碼 <input type="text" name="totp_code" inputmode="numeric" autocomplete="off" required></label>
  <button type="submit">重新產生 API Key</button>
</form>

<table border="1" cellpadding="4">
  <tr><th>ID</th><th>建立時間</th><th>狀態</th></tr>
  {{range .Keys}}
  <tr>
    <td>{{.ID}}</td>
    <td>{{ts .CreatedAt}}</td>
    <td>{{if .Revoked}}已作廢{{else}}使用中{{end}}</td>
  </tr>
  {{end}}
</table>
<script src="/static/js/localtime.js"></script>
</body>
</html>
