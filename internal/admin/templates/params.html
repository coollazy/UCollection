<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>參數設定 - UCollection 後台</title></head>
<body>
<h1>參數設定</h1>
<p><a href="/admin/dashboard">回儀表板</a></p>
{{if .FlashError}}<p style="color:red">{{.FlashError}}</p>{{end}}
{{if .FlashSuccess}}<p style="color:green">{{.FlashSuccess}}</p>{{end}}

<p>以下設定僅影響之後新建立的訂單，不會回頭套用到進行中訂單。</p>

<form method="post" action="/admin/params">
  <p><label>訂單有效期（秒） <input type="number" name="validity_seconds" value="{{if .ValiditySeconds}}{{.ValiditySeconds}}{{end}}" required></label></p>
  <p><label>金額容許誤差百分比 <input type="text" name="amount_tolerance_percent" value="{{if .AmountTolerancePercent}}{{.AmountTolerancePercent}}{{end}}" required></label></p>
  <p><label>確認等待逾時時間（秒，留空時預設沿用訂單有效期） <input type="number" name="confirmation_stall_timeout_seconds" value="{{if .StallTimeoutSeconds}}{{.StallTimeoutSeconds}}{{end}}"></label></p>
  <p><button type="submit">更新</button></p>
</form>
</body>
</html>
