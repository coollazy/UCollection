<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>參數設定 - UCollection 後台</title><link rel="stylesheet" href="/static/css/admin.css"></head>
<body>
<div class="layout">
{{template "nav" .}}
<main class="main">
<div class="main-head"><div><h1>參數設定</h1></div></div>
{{if .FlashError}}<div class="alert alert--error">{{.FlashError}}</div>{{end}}
{{if .FlashSuccess}}<div class="alert alert--success">{{.FlashSuccess}}</div>{{end}}

<p class="muted">以下設定僅影響之後新建立的訂單，不會回頭套用到進行中訂單。</p>

<div class="card" style="margin-bottom:var(--sp5)">
<form method="post" action="/admin/params">
  <div class="field" style="margin-bottom:var(--sp3)"><span class="lbl">訂單有效期（秒）</span><input type="number" name="validity_seconds" value="{{if .ValiditySeconds}}{{.ValiditySeconds}}{{end}}" required></div>
  <div class="field" style="margin-bottom:var(--sp3)"><span class="lbl">確認等待逾時時間（秒，留空時預設沿用訂單有效期）</span><input type="number" name="confirmation_stall_timeout_seconds" value="{{if .StallTimeoutSeconds}}{{.StallTimeoutSeconds}}{{end}}"></div>
  <button type="submit" class="btn btn--primary">更新</button>
</form>
</div>

<div class="card">
<h2 style="margin-top:0">金額容許誤差</h2>
<p class="muted">此設定會影響之後新訂單的短付/溢付判定範圍，變更前需要重新輸入驗證碼。</p>
<form method="post" action="/admin/params/tolerance">
  <div class="field" style="margin-bottom:var(--sp3)"><span class="lbl">金額容許誤差百分比</span><input type="text" name="amount_tolerance_percent" value="{{if .AmountTolerancePercent}}{{.AmountTolerancePercent}}{{end}}" required></div>
  <div class="field" style="margin-bottom:var(--sp3)"><span class="lbl">TOTP驗證碼</span><input type="text" name="totp_code" class="input--code" inputmode="numeric" autocomplete="off" required></div>
  <button type="submit" class="btn btn--primary">更新</button>
</form>
</div>
</main>
</div>
</body>
</html>
