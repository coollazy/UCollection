<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>新增代收主錢包 - UCollection 後台</title>
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="layout">
{{template "navMinimal" .}}
<main class="main">
<div class="main-head"><div><h1>新增代收主錢包</h1></div></div>

<div class="alert alert--info"><strong>助記詞只在此瀏覽器分頁本機運算，永遠不會送到伺服器；只有算出來的xpub（公鑰）會送出。</strong>新增後，目前使用中的代收主錢包將轉為已停用。</div>

<div class="card">
<p id="mode-loading" class="muted">載入中……（若一直停留在此，代表本頁的離線JS尚未部署，暫時無法使用）</p>

<div id="mode-select" hidden style="margin-bottom:var(--sp4)">
  <label><input type="radio" name="wallet-mode" value="existing" checked> 輸入既有助記詞</label>
  <label><input type="radio" name="wallet-mode" value="new"> 產生新錢包</label>
</div>

<div id="existing-mode" hidden>
  <div class="alert alert--error">請確認此助記詞尚未在其他地方作為代收主錢包使用，衍生前請再次確認來源可信。</div>
  <div class="field" style="margin-bottom:var(--sp3)"><span class="lbl">助記詞</span><input type="password" id="existing-mnemonic" autocomplete="off"></div>
  <button type="button" id="existing-derive-button" class="btn btn--primary">衍生xpub</button>
</div>

<div id="new-mode" hidden>
  <button type="button" id="generate-button" class="btn btn--primary">產生新助記詞</button>
  <div id="generated-mnemonic-box" hidden style="margin-top:var(--sp4)">
    <div class="alert alert--error">請將以下助記詞完整抄錄並妥善保存，這是唯一一次顯示的機會。</div>
    <p id="generated-mnemonic-text" class="mono"></p>
    <p>請依提示重新輸入以下位置的單字以確認備份正確：</p>
    <div id="backup-verify-fields"></div>
    <button type="button" id="verify-backup-button" class="btn btn--primary">確認備份</button>
  </div>
</div>

<div id="confirm-box" hidden style="margin-top:var(--sp5)">
  <p>算出的xpub末4碼：<strong id="confirm-xpub-tail" class="mono"></strong></p>
  <div class="field" style="margin-bottom:var(--sp3)"><span class="lbl">TOTP驗證碼</span><input type="text" id="totp-code-input" class="input--code" inputmode="numeric" autocomplete="off"></div>
  <button type="button" id="submit-button" class="btn btn--primary">送出</button>
</div>

<div id="wallet-status" role="status" class="muted" style="margin-top:var(--sp4)"></div>
</div>

<script src="/static/js/polyfill.bundle.js"></script>
<script src="/static/js/masterwallet.bundle.js"></script>
</main>
</div>
</body>
</html>
