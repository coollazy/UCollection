{{define "status_region"}}
<div id="status-region"
     class="checkout-status"
     data-status-url="{{.StatusURL}}"
     data-remaining="{{.RemainingSeconds}}"
     data-countdown="{{.ShowCountdown}}"
     data-terminal="{{.IsTerminal}}">
  <span class="pill {{pillClass .Status}}">{{.Label}}</span>
  <p class="status-detail">{{.Detail}}</p>
  {{if .ShowCountdown}}
  <p class="countdown">剩餘時間：<span data-countdown-display>{{.RemainingSeconds}} 秒</span></p>
  {{end}}
</div>
{{end}}
