<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>登入 - UCollection 後台</title></head>
<body>
<h1>後台登入</h1>
{{if .Error}}<p style="color:red">{{.Error}}</p>{{end}}
<form method="post" action="/admin/login">
  <p><label>帳號 <input type="text" name="username" required autofocus></label></p>
  <p><label>密碼 <input type="password" name="password" required></label></p>
  <p><button type="submit">登入</button></p>
</form>
</body>
</html>
