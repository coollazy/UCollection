<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>重新驗證身分 - UCollection 後台</title></head>
<body>
<h1>請重新驗證身分</h1>
<p>此操作涉及高風險動作，需要在 15 分鐘內完成過一次驗證碼確認。</p>
{{if .Error}}<p style="color:red">{{.Error}}</p>{{end}}
<form method="post" action="/admin/reverify-totp">
  <input type="hidden" name="next" value="{{.Next}}">
  <p><label>驗證碼 <input type="text" name="code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" required autofocus></label></p>
  <p><button type="submit">驗證</button></p>
</form>
</body>
</html>
