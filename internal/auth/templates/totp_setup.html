<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>設定兩步驟驗證 - UCollection 後台</title>
<link rel="stylesheet" href="/static/css/admin.css"></head>
<body>
<div class="auth">
  <div class="auth-card">
    <div class="auth-brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><polygon points="16,2 28,8.5 28,23.5 16,30 4,23.5 4,8.5" fill="none" stroke="#2DD4A7" stroke-width="2"/><path d="M11.5 11v6a4.5 4.5 0 0 0 9 0v-6" fill="none" stroke="#2DD4A7" stroke-width="2.4" stroke-linecap="round"/></svg>
      <div class="name">UCollection</div>
      <div class="sub">首次登入：設定兩步驟驗證（TOTP）</div>
    </div>
    <p class="muted">請用驗證器 App（如 Google Authenticator）掃描下方 QR code，或手動輸入密鑰。</p>
    <p style="text-align:center"><img src="data:image/png;base64,{{.QRCodeBase64}}" alt="TOTP QR code" width="256" height="256"></p>
    <p class="muted">手動輸入密鑰：<span class="mono">{{.Secret}}</span></p>
    {{if .Error}}<div class="alert alert--error">{{.Error}}</div>{{end}}
    <form method="post" action="/admin/login/totp-setup">
      <div class="field"><span class="lbl">驗證碼</span><input type="text" name="code" class="input--code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" required autofocus></div>
      <button type="submit" class="btn btn--primary">完成設定</button>
    </form>
  </div>
</div>
</body>
</html>
