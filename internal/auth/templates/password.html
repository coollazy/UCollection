<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>修改密碼 - UCollection 後台</title>
<link rel="stylesheet" href="/static/css/admin.css"></head>
<body>
<div class="layout">
{{template "nav" .}}
<main class="main">
<div class="main-head"><div><h1>修改密碼</h1></div></div>
{{if .Error}}<div class="alert alert--error">{{.Error}}</div>{{end}}
{{if .Notice}}<div class="alert alert--info">{{.Notice}}</div>{{end}}
<div class="card" style="max-width:420px">
<form method="post" action="/admin/password">
  <div class="field" style="margin-bottom:var(--sp3)"><span class="lbl">目前密碼</span><input type="password" name="current_password" required></div>
  <div class="field" style="margin-bottom:var(--sp3)"><span class="lbl">新密碼（至少12碼）</span><input type="password" name="new_password" required minlength="12"></div>
  <div class="field" style="margin-bottom:var(--sp3)"><span class="lbl">TOTP驗證碼</span><input type="text" name="totp_code" class="input--code" inputmode="numeric" autocomplete="off" required></div>
  <button type="submit" class="btn btn--primary">更新密碼</button>
</form>
</div>
</main>
</div>
</body>
</html>
