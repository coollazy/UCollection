<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>修改密碼 - UCollection 後台</title></head>
<body>
<h1>修改密碼</h1>
{{if .Error}}<p style="color:red">{{.Error}}</p>{{end}}
<form method="post" action="/admin/password">
  <p><label>目前密碼 <input type="password" name="current_password" required></label></p>
  <p><label>新密碼（至少12碼） <input type="password" name="new_password" required minlength="12"></label></p>
  <p><button type="submit">更新密碼</button></p>
</form>
</body>
</html>
