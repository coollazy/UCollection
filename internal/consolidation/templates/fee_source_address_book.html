<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>手續費來源地址簿 - UCollection 後台</title>
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="layout">
{{template "nav" .}}
<main class="main">
<div class="main-head"><div><h1>手續費來源地址簿</h1></div></div>
{{if .Error}}<div class="alert alert--error">{{.Error}}</div>{{end}}
{{if .Notice}}<div class="alert alert--info">{{.Notice}}</div>{{end}}

<p class="muted">此清單為 TRX 手續費來源地址，與「歸集地址簿」（歸集目的地）為兩份獨立清單。</p>

<div class="table-wrap">
<table class="table">
  <tr><th>地址</th><th>名稱</th><th>建立時間</th><th></th></tr>
  {{range .Entries}}
  <tr>
    <td class="mono">{{.Address}}</td>
    <td>
      <form method="post" action="/admin/consolidation/fee-source-book" style="display:inline">
        <input type="hidden" name="id" value="{{.ID}}">
        <input type="hidden" name="address" value="{{.Address}}">
        <input type="text" name="label" value="{{.Label}}">
        <input type="text" name="totp_code" class="input--code" placeholder="TOTP驗證碼" inputmode="numeric" autocomplete="off" required>
        <button type="submit" class="btn btn--sm">改名</button>
      </form>
    </td>
    <td>{{ts .CreatedAt}}</td>
    <td><button type="button" class="btn btn--sm btn--danger" onclick="deleteFeeSourceBookEntry({{.ID}})">刪除</button></td>
  </tr>
  {{end}}
</table>
</div>

<div class="card" style="margin-top:var(--sp6)">
<h2 style="margin-top:0">新增地址</h2>
<form method="post" action="/admin/consolidation/fee-source-book">
  <input type="hidden" name="id" value="">
  <div class="field" style="margin-bottom:var(--sp3)"><span class="lbl">地址</span><input type="text" name="address" required></div>
  <div class="field" style="margin-bottom:var(--sp3)"><span class="lbl">名稱</span><input type="text" name="label" required></div>
  <div class="field" style="margin-bottom:var(--sp3)"><span class="lbl">TOTP驗證碼</span><input type="text" name="totp_code" class="input--code" inputmode="numeric" autocomplete="off" required></div>
  <button type="submit" class="btn btn--primary">新增</button>
</form>
</div>

<script src="/static/js/admin.js"></script>
<script src="/static/js/localtime.js"></script>
</main>
</div>
</body>
</html>
