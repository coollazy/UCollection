<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>選擇代收主錢包 - UCollection 後台</title>
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="layout">
{{template "nav" .}}
<main class="main">
<div class="main-head"><div><h1>手動歸集：選擇代收主錢包</h1></div></div>
{{if not .Wallets}}
  <p class="muted">尚未設定代收主錢包。</p>
{{else}}
  <div class="card">
  <div class="rows">
  {{range .Wallets}}
    <div class="row"><a href="/admin/consolidation?master_wallet_id={{.ID}}">代收主錢包 #{{.ID}}</a><span class="v">{{pill .Status}}</span></div>
  {{end}}
  </div>
  </div>
{{end}}
</main>
</div>
</body>
</html>
